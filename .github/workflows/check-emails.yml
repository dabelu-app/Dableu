name: Check Emails Every 5 Minutes

on:
  schedule:
    # ראשון עד שישי בלבד
    - cron: '*/5 * * * 0-5'
    # מוצאי שבת — מ-19:00 UTC (~22:00 ישראל) עד חצות
    - cron: '*/5 19-23 * * 6'
  workflow_dispatch:

jobs:
  check-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Ping check-emails endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            https://dabelu.vercel.app/api/check-emails
