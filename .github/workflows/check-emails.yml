name: Check Emails Every 5 Minutes

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-emails:
    runs-on: ubuntu-latest
    steps:
      - name: Ping check-emails endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            https://dabelu.vercel.app/api/check-emails
