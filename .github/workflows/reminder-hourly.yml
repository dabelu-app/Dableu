name: Reminder Hourly Check

on:
  schedule:
    # רץ ב-XX:00 כל שעה (UTC) — ראשון עד שישי בלבד (ללא שבת)
    - cron: '0 * * * 0-5'
  workflow_dispatch:

jobs:
  reminder-check:
    runs-on: ubuntu-latest
    steps:
      - name: Ping reminder-hourly endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://dabelu.vercel.app/api/cron?type=reminder-hourly"
