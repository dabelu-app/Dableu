name: Deploy to Firebase Hosting

on:
  workflow_dispatch:   # הופעל ידנית בלבד — בוטל ה-trigger האוטומטי שיצר מיילי כשל

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DABELU }}
          projectId: dabelu
          channelId: live
