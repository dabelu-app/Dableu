<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dabelu Logo Reveal</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 100%;
    height: 100vh;
    overflow: hidden;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', 'Arial', sans-serif;
  }
  
  body {
    background: linear-gradient(135deg, #6F4CFC 0%, #8b6bff 50%, #6F4CFC 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  
  /* Animated background pattern */
  body::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: 
      radial-gradient(circle at 20% 20%, rgba(255,255,255,0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(255,255,255,0.1) 0%, transparent 40%);
    opacity: 0;
    animation: bgFadeIn 1s ease forwards;
  }
  
  @keyframes bgFadeIn {
    to { opacity: 1; }
  }
  
  /* Icon - rotates and zooms in */
  .logo-icon-wrap {
    position: relative;
    margin-bottom: 40px;
    transform: scale(0) rotate(-720deg);
    opacity: 0;
    animation: iconReveal 1.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  
  @keyframes iconReveal {
    to {
      transform: scale(1) rotate(0deg);
      opacity: 1;
    }
  }
  
  .logo-w-icon {
    width: 220px;
    height: auto;
    display: block;
    filter: brightness(0) invert(1) drop-shadow(0 8px 30px rgba(0,0,0,0.3));
  }
  
  /* Continuous shine after icon settled */
  .logo-icon-wrap::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    animation: iconShine 2.5s ease-in-out infinite 2.5s;
  }
  
  @keyframes iconShine {
    0%, 100% { 
      filter: drop-shadow(0 8px 30px rgba(0,0,0,0.3)); 
    }
    50% { 
      filter: drop-shadow(0 0 50px rgba(255,255,255,0.6)); 
    }
  }
  
  /* Letters animate in one by one */
  .logo-name {
    color: white;
    font-size: 80px;
    font-weight: 800;
    letter-spacing: 3px;
    line-height: 1;
    margin-bottom: 20px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.2);
    font-family: 'Century Gothic', 'Avant Garde', 'Poppins', sans-serif;
    display: flex;
    justify-content: center;
    direction: ltr;
  }
  
  .logo-letter {
    display: inline-block;
    opacity: 0;
    transform: translateY(-30px) scale(0.5) rotate(-15deg);
    filter: blur(8px);
    animation: letterDrop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    animation-delay: calc(1.6s + var(--i) * 0.15s);
  }
  
  @keyframes letterDrop {
    0% {
      opacity: 0;
      transform: translateY(-30px) scale(0.5) rotate(-15deg);
      filter: blur(8px);
    }
    60% {
      opacity: 1;
      transform: translateY(5px) scale(1.1) rotate(5deg);
      filter: blur(0);
    }
    100% {
      opacity: 1;
      transform: translateY(0) scale(1) rotate(0);
      filter: blur(0);
    }
  }
  
  /* Tagline appears AFTER all letters */
  .logo-tagline {
    color: white;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: 4px;
    opacity: 0;
    transform: translateY(15px);
    animation: taglineFadeIn 0.8s ease 3.1s forwards;
  }
  
  @keyframes taglineFadeIn {
    to {
      opacity: 0.95;
      transform: translateY(0);
    }
  }
</style>
